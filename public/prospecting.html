<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prospección — La Máquina de Tu Primer Cliente</title>
<style>
  :root { --bg:#0a0a0a; --panel:#131313; --panel2:#1a1a1a; --border:#2a2a2a; --text:#f2f2f2; --muted:#9a9a9a; --accent:#D4AF37; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
  a { color:var(--accent); }
  header { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid var(--border); }
  header h1 { font-size:18px; margin:0; }
  header h1 span { color:var(--accent); }
  main { max-width:1200px; margin:0 auto; padding:24px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:18px; margin-bottom:20px; }
  .card h2 { margin:0 0 14px; font-size:14px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .stat { background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:14px; text-align:center; }
  .stat .n { font-size:28px; font-weight:700; color:var(--accent); }
  .stat .l { font-size:11px; color:var(--muted); margin-top:4px; }
  form.inline { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  label { display:block; font-size:11px; color:var(--muted); margin-bottom:4px; }
  input, select, textarea { background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:8px 10px; font-size:13px; }
  textarea { width:100%; min-height:110px; font-family:inherit; }
  button { background:var(--accent); color:#111; border:none; border-radius:6px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; }
  button.secondary { background:var(--panel2); color:var(--text); border:1px solid var(--border); }
  button.small { padding:4px 8px; font-size:11px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; }
  tr:hover td { background:#161616; }
  .pill { display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600; }
  .p-hi { background:#3a1414; color:#ff8a8a; }
  .p-md { background:#3a2f10; color:#ffd27a; }
  .p-lo { background:#123a1a; color:#8affa0; }
  .status { font-size:11px; padding:2px 8px; border-radius:20px; background:#222; color:var(--muted); }
  #login { max-width:360px; margin:80px auto; }
  #app { display:none; }
  .row-actions { display:flex; gap:6px; flex-wrap:wrap; }
  #detail { position:fixed; top:0; right:0; width:420px; max-width:100%; height:100%; background:var(--panel); border-left:1px solid var(--border); padding:20px; overflow-y:auto; transform:translateX(100%); transition:transform .2s; }
  #detail.open { transform:translateX(0); }
  #detail .close { float:right; cursor:pointer; color:var(--muted); }
  .msg-box { background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:10px; margin:8px 0; font-size:12px; }
  .muted { color:var(--muted); font-size:12px; }
</style>
</head>
<body>

<div id="login" class="card">
  <h2>Entrar</h2>
  <label>Email</label>
  <input id="loginEmail" type="email" style="width:100%;margin-bottom:10px">
  <label>Contraseña</label>
  <input id="loginPw" type="password" style="width:100%;margin-bottom:14px">
  <button onclick="login()" style="width:100%">Entrar</button>
</div>

<div id="app">
  <header>
    <h1>La Máquina de <span>Tu Primer Cliente</span></h1>
    <div><a href="/admin.html">← Admin</a> &nbsp; <button class="secondary small" onclick="logout()">Salir</button></div>
  </header>

  <main>
    <div class="card">
      <h2>Cuota diaria (no negociable)</h2>
      <div class="stats" id="stats">
        <div class="stat"><div class="n" id="statNew">–</div><div class="l">negocios nuevos hoy</div></div>
        <div class="stat"><div class="n" id="statAudited">–</div><div class="l">auditorías hoy</div></div>
        <div class="stat"><div class="n" id="statMsgs">–</div><div class="l">mensajes mandados hoy</div></div>
        <div class="stat"><div class="n" id="statPending">–</div><div class="l">seguimientos pendientes</div></div>
      </div>
    </div>

    <div class="card">
      <h2>Paso 1 · Scrapea</h2>
      <form class="inline" onsubmit="startBatch(event)">
        <div><label>Nicho</label><input id="niche" placeholder="talleres mecánicos" required></div>
        <div><label>Ciudad</label><input id="city" placeholder="Miami" required></div>
        <div><label>Servicio que ofreces</label><input id="serviceOffered" placeholder="agente de WhatsApp con IA"></div>
        <div><label>Límite</label><input id="limit" type="number" value="100" style="width:80px"></div>
        <div><button type="submit" id="batchBtn">Lanzar batch</button></div>
      </form>
      <p class="muted" id="batchStatus"></p>
    </div>

    <div class="card">
      <h2>Prospectos</h2>
      <form class="inline" onsubmit="event.preventDefault(); loadProspects()" style="margin-bottom:12px">
        <div><label>Batch</label>
          <select id="batchFilter" onchange="loadProspects()"><option value="">Todos</option></select>
        </div>
        <div><label>Estado</label>
          <select id="statusFilter" onchange="loadProspects()">
            <option value="">Todos</option>
            <option value="new">new</option>
            <option value="audited">audited</option>
            <option value="contacted">contacted</option>
            <option value="followup_2">followup_2</option>
            <option value="followup_4">followup_4</option>
            <option value="followup_7">followup_7</option>
            <option value="won">won</option>
            <option value="lost">lost</option>
            <option value="do_not_contact">do_not_contact</option>
          </select>
        </div>
      </form>
      <table>
        <thead><tr>
          <th>Negocio</th><th>Contacto</th><th>Reseñas</th><th>Dolor</th><th>Estado</th><th></th>
        </tr></thead>
        <tbody id="prospectsBody"><tr><td colspan="6" class="muted">Sin datos todavía.</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<div id="detail">
  <span class="close" onclick="closeDetail()">✕ cerrar</span>
  <div id="detailBody"></div>
</div>

<script>
let pw = sessionStorage.getItem('ai_pw') || '', email = sessionStorage.getItem('ai_email') || '';
let batches = [], prospects = [];

function authHeaders(extra) {
  return Object.assign({ 'x-admin-password': pw, 'x-admin-email': email }, extra || {});
}

async function api(path, opts = {}) {
  const res = await fetch('/api/prospecting' + path, {
    ...opts,
    headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders(), opts.headers || {})
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

async function login() {
  const pwVal = document.getElementById('loginPw').value;
  const emailVal = document.getElementById('loginEmail').value.trim();
  try {
    const { token } = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwVal, email: emailVal })
    }).then(r => { if (!r.ok) throw new Error('auth'); return r.json(); });
    pw = token; email = emailVal;
    sessionStorage.setItem('ai_pw', pw);
    sessionStorage.setItem('ai_email', email);
    showApp();
  } catch (e) { alert('Email o contraseña incorrectos'); }
}

function logout() {
  sessionStorage.removeItem('ai_pw'); sessionStorage.removeItem('ai_email');
  pw = ''; email = '';
  document.getElementById('login').style.display = '';
  document.getElementById('app').style.display = 'none';
}

async function showApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  await Promise.all([loadStats(), loadBatches(), loadProspects()]);
}

async function loadStats() {
  try {
    const s = await api('/stats/today');
    document.getElementById('statNew').textContent = s.newToday;
    document.getElementById('statAudited').textContent = s.auditedToday;
    document.getElementById('statMsgs').textContent = s.messagesToday;
    document.getElementById('statPending').textContent = s.pendingFollowups;
  } catch (e) {}
}

async function loadBatches() {
  const { batches: rows } = await api('/batches');
  batches = rows;
  const sel = document.getElementById('batchFilter');
  sel.innerHTML = '<option value="">Todos</option>' + rows.map(b =>
    `<option value="${b.id}">${b.niche} · ${b.city} (${b.total_scraped || 0})</option>`
  ).join('');
}

async function startBatch(ev) {
  ev.preventDefault();
  const btn = document.getElementById('batchBtn');
  const niche = document.getElementById('niche').value.trim();
  const city = document.getElementById('city').value.trim();
  const serviceOffered = document.getElementById('serviceOffered').value.trim();
  const limit = Number(document.getElementById('limit').value) || 100;
  btn.disabled = true;
  document.getElementById('batchStatus').textContent = 'Scrapeando con Apify... esto puede tardar un par de minutos.';
  try {
    const { batch } = await api('/batches', { method: 'POST', body: JSON.stringify({ niche, city, serviceOffered, limit }) });
    document.getElementById('batchStatus').textContent = `Batch listo: ${batch.total_scraped} negocios encontrados.`;
    await loadBatches();
    document.getElementById('batchFilter').value = batch.id;
    await loadProspects();
    await loadStats();
  } catch (e) {
    document.getElementById('batchStatus').textContent = 'Error: ' + e.message;
  } finally { btn.disabled = false; }
}

async function loadProspects() {
  const batchId = document.getElementById('batchFilter').value;
  const status = document.getElementById('statusFilter').value;
  const params = new URLSearchParams();
  if (batchId) params.set('batchId', batchId);
  if (status) params.set('status', status);
  const { prospects: rows } = await api('/prospects?' + params.toString());
  prospects = rows;
  renderProspects();
}

function renderProspects() {
  const body = document.getElementById('prospectsBody');
  if (!prospects.length) { body.innerHTML = '<tr><td colspan="6" class="muted">Sin prospectos todavía.</td></tr>'; return; }
  body.innerHTML = prospects.map(p => `
    <tr>
      <td>${p.name || '—'}<br><span class="muted">${p.category || ''}</span></td>
      <td>${p.phone ? '📱 ' + p.phone : ''}${p.instagram ? '<br>📷 ' + p.instagram : ''}${!p.phone && !p.instagram ? '—' : ''}</td>
      <td>${p.rating ?? '—'} ★ (${p.reviews_count ?? 0})</td>
      <td><span class="pill p-${p.pain_tier}">${p.pain_score}</span></td>
      <td><span class="status">${p.status}</span></td>
      <td class="row-actions"><button class="secondary small" onclick="openDetail('${p.id}')">Ver</button></td>
    </tr>
  `).join('');
}

async function openDetail(id) {
  const detail = document.getElementById('detail');
  const body = document.getElementById('detailBody');
  body.innerHTML = '<p class="muted">Cargando…</p>';
  detail.classList.add('open');
  const { prospect, audits, messages } = await api('/prospects/' + id);
  const latestAudit = audits[0];
  const issues = latestAudit ? JSON.parse(latestAudit.issues_json || '[]') : [];

  body.innerHTML = `
    <h2 style="margin-top:0">${prospect.name}</h2>
    <p class="muted">${prospect.category || ''} · ${prospect.address || ''}</p>
    <p>${prospect.phone ? '📱 ' + prospect.phone + '<br>' : ''}${prospect.website ? '🌐 <a href="' + prospect.website + '" target="_blank">' + prospect.website + '</a><br>' : ''}${prospect.instagram ? '📷 ' + prospect.instagram : ''}</p>
    <p><span class="pill p-${painTier(prospect.pain_score)}">pain_score: ${prospect.pain_score}</span> &nbsp; <span class="status">${prospect.status}</span></p>

    <div class="card" style="margin-top:14px">
      <h2>Cambiar estado</h2>
      <select id="statusSelect">
        ${['new','audited','contacted','followup_2','followup_4','followup_7','won','lost','do_not_contact']
          .map(s => `<option value="${s}" ${s === prospect.status ? 'selected' : ''}>${s}</option>`).join('')}
      </select>
      <button class="secondary small" onclick="setStatus('${id}')">Guardar</button>
    </div>

    <div class="card">
      <h2>Paso 2 · Construye (auditoría)</h2>
      ${issues.length ? '<ul>' + issues.map(i => `<li>${i}</li>`).join('') + '</ul>' : '<p class="muted">Sin auditoría todavía.</p>'}
      <button onclick="runAudit('${id}')" id="auditBtn">Auditar ahora</button>
    </div>

    <div class="card">
      <h2>Paso 3 · Manda</h2>
      <form class="inline" onsubmit="event.preventDefault()">
        <div><label>Etapa</label>
          <select id="msgStage">
            <option value="opener">Opener</option>
            <option value="day2">Día 2</option>
            <option value="day4">Día 4</option>
            <option value="day7">Día 7</option>
          </select>
        </div>
        <div><label>Canal</label>
          <select id="msgChannel">
            <option value="whatsapp">WhatsApp (envío real)</option>
            <option value="instagram">Instagram (copiar/pegar)</option>
          </select>
        </div>
      </form>
      <div style="margin-top:8px"><label>Tu nombre</label><input id="senderName" placeholder="tu nombre" style="width:100%;margin-bottom:6px">
      <label>Link del video (90seg)</label><input id="videoUrl" placeholder="https://..." style="width:100%"></div>
      <div style="margin-top:10px"><button onclick="genMessage('${id}')">Generar mensaje</button></div>
      <div id="msgResult"></div>
      <h3 style="font-size:12px;color:var(--muted);margin-top:16px">Historial</h3>
      ${messages.map(m => `<div class="msg-box"><b>${m.stage}</b> · ${m.channel} · <span class="muted">${m.status}</span><br>${(m.message_text || '').replace(/\n/g,'<br>')}</div>`).join('') || '<p class="muted">Sin mensajes todavía.</p>'}
    </div>
  `;
}

function painTier(score) { return score >= 6 ? 'hi' : score >= 3 ? 'md' : 'lo'; }

function closeDetail() { document.getElementById('detail').classList.remove('open'); }

async function setStatus(id) {
  const status = document.getElementById('statusSelect').value;
  await api(`/prospects/${id}/status`, { method: 'PATCH', body: JSON.stringify({ status }) });
  await loadProspects();
  closeDetail();
}

async function runAudit(id) {
  const btn = document.getElementById('auditBtn');
  btn.disabled = true; btn.textContent = 'Auditando…';
  try {
    await api(`/prospects/${id}/audit`, { method: 'POST' });
    await loadStats();
    await openDetail(id);
  } catch (e) { alert('Error: ' + e.message); btn.disabled = false; btn.textContent = 'Auditar ahora'; }
}

async function genMessage(id) {
  const stage = document.getElementById('msgStage').value;
  const channel = document.getElementById('msgChannel').value;
  const senderName = document.getElementById('senderName').value.trim();
  const videoUrl = document.getElementById('videoUrl').value.trim();
  const result = document.getElementById('msgResult');
  result.innerHTML = '<p class="muted">Generando…</p>';
  try {
    const { message } = await api(`/prospects/${id}/message`, { method: 'POST', body: JSON.stringify({ stage, channel, senderName, videoUrl }) });
    result.innerHTML = `
      <textarea id="msgText" readonly>${message.message_text}</textarea>
      <div style="margin-top:8px;display:flex;gap:8px">
        <button class="secondary small" onclick="copyMsg()">Copiar</button>
        ${channel === 'whatsapp'
          ? `<button class="small" onclick="sendMsg('${message.id}','${id}')">Enviar por WhatsApp</button>`
          : `<button class="small" onclick="markCopied('${message.id}','${id}')">Marcar como listo</button>`}
      </div>`;
  } catch (e) { result.innerHTML = `<p class="muted">Error: ${e.message}</p>`; }
}

function copyMsg() {
  const ta = document.getElementById('msgText');
  ta.select(); document.execCommand('copy');
}

async function sendMsg(messageId, prospectId) {
  try {
    await api(`/messages/${messageId}/send`, { method: 'POST' });
    await loadStats();
    await openDetail(prospectId);
  } catch (e) { alert('Error al enviar: ' + e.message); }
}

async function markCopied(messageId, prospectId) {
  try {
    await api(`/messages/${messageId}/send`, { method: 'POST' });
    await openDetail(prospectId);
  } catch (e) { alert('Error: ' + e.message); }
}

if (pw) showApp();
</script>
</body>
</html>
