<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voces — Ronda 2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0B0F14; font-family: system-ui, sans-serif; padding: 40px 20px; }
  h1 { color: #27F59B; font-size: 22px; margin-bottom: 8px; }
  p { color: #9FB0C8; font-size: 14px; margin-bottom: 32px; }
  .voice { background: #111827; border: 1px solid #252A38; border-radius: 10px; padding: 20px 24px; margin-bottom: 16px; display: flex; align-items: center; gap: 20px; }
  .num { color: #27F59B; font-size: 28px; font-weight: 800; width: 32px; flex-shrink: 0; }
  .name { color: #FFFFFF; font-size: 17px; font-weight: 600; min-width: 200px; }
  audio { flex: 1; height: 36px; }
</style>
</head>
<body>
  <h1>Voces — Ronda 2</h1>
  <p>Estas son clonadas desde voces reales en tu cuenta HeyGen. Escucha y dime cuál se acerca más a lo que buscas.</p>

  <div class="voice">
    <div class="num">1</div>
    <div class="name">VIP TECH CONSULTING</div>
    <audio controls src="/v2_1_viptech.mp3"></audio>
  </div>

  <div class="voice">
    <div class="num">2</div>
    <div class="name">Simon Nueva Spanish</div>
    <audio controls src="/v2_2_simon-nueva.mp3"></audio>
  </div>

  <div class="voice">
    <div class="num">3</div>
    <div class="name">Simon — 207</div>
    <audio controls src="/v2_3_simon-207.mp3"></audio>
  </div>

  <div class="voice">
    <div class="num">4</div>
    <div class="name">Simon Clonada</div>
    <audio controls src="/v2_4_simon-clonada.mp3"></audio>
  </div>
</body>
</html>
