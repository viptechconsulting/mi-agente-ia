<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inbox">
<meta name="theme-color" content="#0b0f1a">
<title>Inbox · Lynkro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0b0f1a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e2e8f0}
#login{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;padding:32px}
#login h1{font-size:1.5rem;font-weight:800;color:#27f59b;letter-spacing:-.02em}
#login p{color:#64748b;font-size:.85rem;text-align:center}
#login input{width:100%;max-width:320px;padding:13px 16px;border-radius:12px;border:1.5px solid #1e293b;background:#1e293b;color:#e2e8f0;font-size:1rem;outline:none;transition:border-color .15s}
#login input:focus{border-color:#27f59b}
.btn-primary{width:100%;max-width:320px;padding:13px;background:#27f59b;color:#0b0f1a;font-weight:800;font-size:1rem;border:none;border-radius:12px;cursor:pointer}
#login-err{color:#f87171;font-size:.8rem;display:none}
#app{display:none;height:100%;overflow:hidden}
#app.show{display:flex}
#sidebar{width:330px;min-width:260px;border-right:1px solid #1a2332;display:flex;flex-direction:column;height:100%;flex-shrink:0}
.sbar-head{padding:13px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1a2332;flex-shrink:0}
.sbar-logo{color:#27f59b;font-weight:800;font-size:1rem}
.sbar-actions{display:flex;gap:6px}
.icon-btn{width:32px;height:32px;border-radius:8px;background:#1a2332;border:1px solid #243047;color:#94a3b8;font-size:.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.icon-btn.on{background:rgba(39,245,155,.1);color:#27f59b;border-color:rgba(39,245,155,.3)}
.search-bar{padding:8px 12px;border-bottom:1px solid #1a2332;flex-shrink:0}
.search-bar input{width:100%;padding:8px 12px;background:#111827;border:1.5px solid #1a2332;border-radius:8px;color:#e2e8f0;font-size:.85rem;outline:none}
.search-bar input:focus{border-color:#27f59b}
#conv-list{flex:1;overflow-y:auto}
.conv-item{padding:12px 14px;border-bottom:1px solid #0d1117;cursor:pointer;transition:background .1s;display:flex;gap:10px;align-items:flex-start}
.conv-item:hover,.conv-item.sel{background:#111827}
.conv-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.75rem;flex-shrink:0;position:relative;background:#1e293b;color:#64748b}
.conv-av.new{background:rgba(39,245,155,.12);color:#27f59b}
.conv-av .ndot{position:absolute;top:-1px;right:-1px;width:9px;height:9px;background:#27f59b;border-radius:50%;border:2px solid #0b0f1a}
.conv-body{flex:1;min-width:0}
.conv-row1{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-bottom:2px}
.conv-nm{font-size:.82rem;font-weight:600;color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-ts{font-size:.67rem;color:#475569;flex-shrink:0}
.conv-snip{font-size:.75rem;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-snip.new{color:#94a3b8;font-weight:500}
.conv-co{font-size:.65rem;color:#334155;margin-top:2px}
.badge-hm{font-size:.57rem;padding:1px 5px;border-radius:100px;background:rgba(250,204,21,.08);color:#fbbf24;font-weight:700;letter-spacing:.03em;margin-left:4px;border:1px solid rgba(250,204,21,.15)}
.empty-s{display:flex;align-items:center;justify-content:center;padding:40px 20px;color:#334155;font-size:.85rem}
#chatpane{flex:1;display:flex;flex-direction:column;height:100%;overflow:hidden;background:#0d1117}
.chat-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;color:#334155}
.chat-empty svg{width:48px;height:48px;opacity:.2}
.chat-head{padding:12px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #1a2332;background:#0b0f1a;flex-shrink:0}
.back-btn{background:none;border:none;color:#64748b;font-size:1.4rem;cursor:pointer;padding:0 6px;display:none;line-height:1}
.chat-head-info{flex:1;min-width:0}
.chat-head-name{font-weight:700;font-size:.9rem;color:#e2e8f0}
.chat-head-sub{font-size:.72rem;color:#475569;margin-top:1px}
.toggle-ai{padding:6px 12px;border-radius:8px;font-size:.74rem;font-weight:700;cursor:pointer;border:none;white-space:nowrap;transition:.15s}
.toggle-ai.on{background:rgba(39,245,155,.1);color:#27f59b;border:1px solid rgba(39,245,155,.25)}
.toggle-ai.off{background:rgba(250,204,21,.1);color:#fbbf24;border:1px solid rgba(250,204,21,.2)}
#msgs{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:8px}
.mw{display:flex;flex-direction:column;max-width:80%}
.mw.user{align-self:flex-end;align-items:flex-end}
.mw.assistant{align-self:flex-start;align-items:flex-start}
.mw-lbl{font-size:.62rem;color:#475569;margin-bottom:2px}
.mb{padding:9px 13px;border-radius:14px;font-size:.86rem;line-height:1.5;word-wrap:break-word;white-space:pre-wrap}
.mb.user{background:#1d4ed8;color:#e2e8f0;border-bottom-right-radius:3px}
.mb.assistant{background:#1e293b;color:#e2e8f0;border-bottom-left-radius:3px}
.mb-t{font-size:.62rem;color:#334155;margin-top:2px}
#reply-bar{padding:10px 12px;border-top:1px solid #1a2332;display:flex;gap:8px;align-items:flex-end;flex-shrink:0;background:#0b0f1a;padding-bottom:max(10px,env(safe-area-inset-bottom))}
#reply-in{flex:1;background:#1a2332;border:1.5px solid #243047;border-radius:12px;color:#e2e8f0;font-size:.9rem;padding:9px 13px;outline:none;resize:none;max-height:120px;font-family:inherit;line-height:1.4;transition:border-color .15s}
#reply-in:focus{border-color:#27f59b}
#send-btn{width:38px;height:38px;background:#27f59b;border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s}
#send-btn:hover{opacity:.85}
#send-btn:disabled{opacity:.35;cursor:not-allowed}
#send-btn svg{width:16px;height:16px;fill:#0b0f1a}
@media(max-width:680px){
  #sidebar{width:100%;border-right:none}
  #chatpane{position:fixed;inset:0;background:#0d1117;transform:translateX(100%);transition:transform .22s ease;z-index:20}
  #chatpane.open{transform:translateX(0)}
  .back-btn{display:block}
}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#1e293b;border-radius:2px}
</style>
</head>
<body>

<div id="login" style="display:none">
  <h1>Lynkro Inbox</h1>
  <p>Accede con tu email y contraseña de admin</p>
  <input id="l-em" type="email" placeholder="Email de admin" autocomplete="email">
  <input id="l-pw" type="password" placeholder="Contraseña" autocomplete="current-password">
  <button class="btn-primary" onclick="doLogin()">Entrar</button>
  <span id="login-err">Credenciales incorrectas</span>
</div>

<div id="app">
  <div id="sidebar">
    <div class="sbar-head">
      <span class="sbar-logo">💬 Inbox</span>
      <div class="sbar-actions">
        <button class="icon-btn" id="notif-btn" onclick="toggleNotif()" title="Notificaciones">🔔</button>
        <button class="icon-btn" onclick="doLogout()" title="Salir">✕</button>
      </div>
    </div>
    <div class="search-bar">
      <input id="srch" type="search" placeholder="Buscar conversación…" oninput="renderList()">
    </div>
    <div id="conv-list"><div class="empty-s">Cargando…</div></div>
  </div>

  <div id="chatpane">
    <div class="chat-empty" id="chat-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
      <p>Selecciona una conversación</p>
    </div>
    <div id="chat-view" style="display:none;flex-direction:column;height:100%;overflow:hidden">
      <div class="chat-head">
        <button class="back-btn" onclick="closeChat()">‹</button>
        <div class="chat-head-info">
          <div class="chat-head-name" id="chat-nm">—</div>
          <div class="chat-head-sub" id="chat-sub"></div>
        </div>
        <button class="toggle-ai on" id="ai-btn" onclick="toggleAI()">▶ IA activa</button>
      </div>
      <div id="msgs"></div>
      <div id="reply-bar">
        <textarea id="reply-in" placeholder="Escribe y presiona Enter…" rows="1"></textarea>
        <button id="send-btn" onclick="sendReply()">
          <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
const API = window.location.origin;
let em = localStorage.getItem('ibx_em') || '';
let pw = localStorage.getItem('ibx_pw') || '';
let activeId = null;
let activeCo = null; // companyId of open conversation
let convs = [];
let humanMode = false;
let listTimer = null;
let msgTimer = null;
let notifOn = false;
let seenIds = new Set();
let initialized = false;

function enc(s){ return encodeURIComponent(s) }
function auth(){ return `adminEmail=${enc(em)}&adminPassword=${enc(pw)}` }
function apiQ(path, extra){ return `${API}${path}?${auth()}${extra?'&'+extra:''}` }

// ── Auth ──────────────────────────────────────────────────────────
async function doLogin(){
  const e2 = (document.getElementById('l-em').value||'').trim();
  const p2 = (document.getElementById('l-pw').value||'').trim();
  if(!e2||!p2) return;
  em=e2; pw=p2;
  const r = await fetch(apiQ('/api/inbox/conversations')).catch(()=>null);
  if(!r||!r.ok){ document.getElementById('login-err').style.display='block'; em=''; pw=''; return; }
  localStorage.setItem('ibx_em',em); localStorage.setItem('ibx_pw',pw);
  boot();
}

function doLogout(){
  localStorage.removeItem('ibx_em'); localStorage.removeItem('ibx_pw');
  em=''; pw=''; convs=[]; activeId=null; activeCo=null;
  clearInterval(listTimer); clearInterval(msgTimer);
  document.getElementById('app').classList.remove('show');
  document.getElementById('login').style.display='flex';
}

// ── Boot ──────────────────────────────────────────────────────────
async function boot(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').classList.add('show');
  requestNotif();
  await loadList();
  listTimer = setInterval(loadList, 4000);
}

// ── Notifications ─────────────────────────────────────────────────
function requestNotif(){
  if(!('Notification' in window)) return;
  if(Notification.permission==='granted'){ notifOn=true; updNotifBtn(); return; }
  Notification.requestPermission().then(p=>{ notifOn=p==='granted'; updNotifBtn(); });
}
function toggleNotif(){
  if(Notification.permission!=='granted'){ requestNotif(); return; }
  notifOn=!notifOn; updNotifBtn();
}
function updNotifBtn(){ document.getElementById('notif-btn').classList.toggle('on',notifOn); }
function doNotify(title, body, id){
  if(!notifOn) return;
  const n = new Notification(title,{body:body.substring(0,100),icon:'/favicon.ico',tag:id});
  n.onclick=()=>{ window.focus(); openConvById(id); n.close(); };
}

// ── List ──────────────────────────────────────────────────────────
async function loadList(){
  try{
    const r = await fetch(apiQ('/api/inbox/conversations'));
    if(!r.ok){ if(r.status===401||r.status===403) doLogout(); return; }
    convs = await r.json();
    renderList();
    if(initialized){
      convs.forEach(c=>{
        if(!seenIds.has(c.id) && (Date.now()-c.updated_at)<90000) {
          doNotify('💬 '+c.company_name, c.last_content||'Nuevo visitante', c.id);
        }
      });
    }
    convs.forEach(c=>seenIds.add(c.id));
    initialized=true;
  } catch{}
}

function timeAgo(ts){
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'ahora'; if(s<3600) return Math.floor(s/60)+'m';
  if(s<86400) return Math.floor(s/3600)+'h'; return Math.floor(s/86400)+'d';
}

function renderList(){
  const q=(document.getElementById('srch').value||'').toLowerCase();
  let list = q
    ? convs.filter(c=>(c.company_name||'').toLowerCase().includes(q)||(c.last_content||'').toLowerCase().includes(q)||(c.id||'').includes(q))
    : convs;
  const el=document.getElementById('conv-list');
  if(!list.length){ el.innerHTML='<div class="empty-s">Sin conversaciones</div>'; return; }
  el.innerHTML=list.map(c=>{
    const isRecent=(Date.now()-c.updated_at)<300000; // 5 min
    const ini=(c.visitor_id||'V').replace(/[^a-z0-9]/gi,'').slice(-3).toUpperCase()||'WEB';
    const snip=(c.last_content||'—').substring(0,52);
    return `<div class="conv-item${c.id===activeId?' sel':''}" onclick="openConvById('${c.id}')">
      <div class="conv-av${isRecent?' new':''}">${ini}${isRecent?'<div class="ndot"></div>':''}</div>
      <div class="conv-body">
        <div class="conv-row1">
          <span class="conv-nm">${esc(c.id.slice(0,6))}${c.human_mode?'<span class="badge-hm">espera</span>':''}</span>
          <span class="conv-ts">${timeAgo(c.updated_at)}</span>
        </div>
        <div class="conv-snip${isRecent?' new':''}">${isRecent?'● ':''}${esc(snip)}</div>
        <div class="conv-co">${esc(c.company_name||'')}</div>
      </div>
    </div>`;
  }).join('');
}

// ── Chat ──────────────────────────────────────────────────────────
function openConvById(id){ const c=convs.find(x=>x.id===id); if(c) openConv(c); }
async function openConv(c){
  if(!c) return;
  activeId=c.id; activeCo=c.company_id;
  clearInterval(msgTimer);
  document.getElementById('chat-empty').style.display='none';
  document.getElementById('chat-view').style.display='flex';
  document.getElementById('chatpane').classList.add('open');
  document.getElementById('chat-nm').textContent=c.company_name+' · '+c.id.slice(0,8);
  await loadMsgs();
  msgTimer=setInterval(loadMsgs,2500);
  renderList();
}

async function loadMsgs(){
  if(!activeId||!activeCo) return;
  try{
    const r=await fetch(apiQ('/api/inbox/conversations/'+activeId,'companyId='+enc(activeCo)));
    if(!r.ok) return;
    const data=await r.json();
    humanMode=!!data.conv.human_mode;
    const btn=document.getElementById('ai-btn');
    if(humanMode){ btn.textContent='⏸ Tú atiendes'; btn.className='toggle-ai off'; }
    else { btn.textContent='▶ IA activa'; btn.className='toggle-ai on'; }
    document.getElementById('chat-sub').textContent=humanMode?'Atendiendo manualmente':'IA está respondiendo';
    renderMsgs(data.msgs||[]);
  } catch{}
}

function renderMsgs(msgs){
  const el=document.getElementById('msgs');
  const atBot=el.scrollHeight-el.scrollTop<=el.clientHeight+60;
  el.innerHTML=msgs.map(m=>{
    const t=new Date(m.created_at).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
    return `<div class="mw ${m.role}"><div class="mw-lbl">${m.role==='user'?'Visitante':'Tú / IA'}</div><div class="mb ${m.role}">${linkify(m.content)}</div><div class="mb-t">${t}</div></div>`;
  }).join('');
  if(atBot) el.scrollTop=el.scrollHeight;
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }
function linkify(s){ return esc(s).replace(/(https?:\/\/[^\s<>"&]+)/g,'<a href="$1" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;word-break:break-all">$1</a>'); }

function closeChat(){
  document.getElementById('chatpane').classList.remove('open');
  document.getElementById('chat-view').style.display='none';
  document.getElementById('chat-empty').style.display='flex';
  clearInterval(msgTimer);
  activeId=null; activeCo=null;
  renderList();
}

// ── Toggle IA ─────────────────────────────────────────────────────
async function toggleAI(){
  if(!activeId||!activeCo) return;
  const mode=humanMode?0:1;
  await fetch(apiQ('/api/inbox/conversations/'+activeId+'/human-mode'),{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({mode,companyId:activeCo})
  });
  await loadMsgs();
}

// ── Reply ─────────────────────────────────────────────────────────
async function sendReply(){
  const inp=document.getElementById('reply-in');
  const text=inp.value.trim();
  if(!text||!activeId||!activeCo) return;
  const btn=document.getElementById('send-btn');
  btn.disabled=true; inp.value=''; inp.style.height='auto';
  try{
    await fetch(apiQ('/api/inbox/conversations/'+activeId+'/reply'),{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text,companyId:activeCo})
    });
    await loadMsgs();
  } catch{}
  btn.disabled=false; inp.focus();
}

// ── Input ─────────────────────────────────────────────────────────
document.getElementById('reply-in').addEventListener('input',function(){
  this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,120)+'px';
});
document.getElementById('reply-in').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendReply(); }
});
document.getElementById('l-pw').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('l-em').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('l-pw').focus(); });

// ── Init ──────────────────────────────────────────────────────────
if(em&&pw){
  fetch(apiQ('/api/inbox/conversations')).then(r=>{
    if(r.ok) boot();
    else { em=''; pw=''; document.getElementById('login').style.display='flex'; }
  }).catch(()=>{ document.getElementById('login').style.display='flex'; });
} else {
  document.getElementById('login').style.display='flex';
}
</script>
</body>
</html>
